[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
gas_reports = ["EctoplasmVault", "SubscriptionManager"]

[profile.default.fmt]
bracket_spacing = false
int_types = "long"
line_length = 120
multiline_func_header = "all"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
wrap_comments = true

[rpc_endpoints]
monad_mainnet = "${MONAD_RPC_URL}"
monad_testnet = "https://testnet-rpc.monad.xyz"
localhost = "http://127.0.0.1:8545"

[etherscan]
monad_mainnet = { key = "${EXPLORER_API_KEY}", url = "https://monadscan.com/api" }
